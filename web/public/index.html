<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>弱覆盖本体应用 · 无线优化决策工作台</title>
<link rel="stylesheet" href="./assets/app.css">
<link rel="modulepreload" href="./assets/core.js">
<link rel="modulepreload" href="./assets/viz.js">
<link rel="modulepreload" href="./assets/views.js">
<link rel="modulepreload" href="./assets/board.js">
<link rel="modulepreload" href="./assets/cellflow.js">
<link rel="modulepreload" href="./assets/ui.js">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304060d'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%235eeaff' stroke-width='2'/%3E%3Ccircle cx='16' cy='5' r='2.4' fill='%23a78bfa'/%3E%3Ccircle cx='26' cy='21' r='2.4' fill='%23a78bfa'/%3E%3Ccircle cx='6' cy='21' r='2.4' fill='%23a78bfa'/%3E%3Cpath d='M16 7.5 16 11M18.4 18 24 20M13.6 18 8 20' stroke='%235eeaff' stroke-width='1.4'/%3E%3C/svg%3E">
</head>
<body>
<div class="shell">

  <!-- ── 顶栏 ─────────────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="5.2" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="16" cy="4.6" r="2.5" fill="currentColor" opacity=".85"/>
          <circle cx="26.6" cy="21.4" r="2.5" fill="currentColor" opacity=".85"/>
          <circle cx="5.4" cy="21.4" r="2.5" fill="currentColor" opacity=".85"/>
          <path d="M16 7.2 16 10.8M19 18.6 24.8 20.8M13 18.6 7.2 20.8" stroke="currentColor" stroke-width="1.3" opacity=".75"/>
        </svg>
      </div>
      <div class="brand-txt">
        <h1>无线弱覆盖分析及优化决策</h1>
        <p>ONTOLOGY-DRIVEN WORKBENCH · SHANGHAI</p>
      </div>
    </div>

    <div class="topbar-mid">
      <div class="crumb" id="crumb"></div>
      <div class="telem"><span class="eyebrow">Ontology</span><span class="val" id="telOnt">—</span></div>
      <div class="telem"><span class="eyebrow">Spec Fingerprint</span><span class="val" id="telSpec">—</span></div>
      <div class="telem"><span class="eyebrow">Anchor</span><span class="val">OT_CELL_MR</span></div>
    </div>

    <div class="topbar-right">
      <div class="telem" style="align-items:flex-end"><span class="eyebrow">判断时点</span>
        <input id="clockInput" type="text" value="—" style="width:158px" title="修改后回车：推进本体的仿真时钟（MR 数据按到达时刻陆续入库）"></div>
      <button class="btn ghost" id="clockBtn" title="推进判断时点一天">+1d</button>
      <select id="roleSel" title="角色决定可用动作（x-context-key-groups）"></select>
      <select id="analysisModeSel" title="独立分析：每次点击小区都从初始数据开始；连续分析：保留本轮时点、工单和案例以便复用">
        <option value="independent">独立分析</option><option value="continuous">连续分析</option>
      </select>
      <select id="paceSel" title="两种方式执行相同业务规则；逐步演示保留每步展示停顿">
        <option value="fast">快速结果</option><option value="demo">逐步演示</option>
      </select>
      <button class="btn ghost" id="resetBtn" title="仅重置本次分析，其他访问者的分析保持原状态">重置</button>
      <span class="lamp" title="本体服务在线"></span>
    </div>
  </header>

  <!-- ── 工作区 ───────────────────────────────────────────────────── -->
  <div class="workspace">
    <aside class="rail" id="rail"></aside>
    <main class="main" id="main"><div class="loading">载入本体 …</div></main>
    <aside class="aside">
      <section class="insp">
        <div class="insp-hd"><span class="k">本体要素</span><span class="eyebrow">INSPECTOR</span></div>
        <div class="insp-bd" id="inspBody"><div class="empty">点击任意本体要素徽章<br>查看它在本体的定义、校验点与依据</div></div>
      </section>
      <section class="chat">
        <div class="chat-hd"><span class="k">本体问答</span><span class="eyebrow">QA · GROUNDED</span></div>
        <div id="chatBox" style="display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden"></div>
      </section>
    </aside>
  </div>
  <!-- ── 状态栏 ───────────────────────────────────────────────────── -->
  <footer class="statusbar" id="status"></footer>
</div>
<!-- ── 步骤详情弹窗（点决策链上的步骤卡片才打开） ─────────────────── -->
<div id="modal" class="modal" hidden></div>
<script type="module" src="./assets/app.js"></script>
</body>
</html>
